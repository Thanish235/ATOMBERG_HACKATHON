              <td style="font-size:12px;max-width:300px">${l.message}</td>
              <td style="font-size:11px;color:var(--text2)">${timeAgo(l.created_at)}</td>
              <td>${l.status === "open" ? `<button class="btn btn-sm" style="background:var(--success)22;color:var(--success);border:none" onclick="resolveEscalation(${l.id})">Resolve</button>` : "—"}</td>
            </tr>`,
              )
              .join("")}
          </tbody>
        </table></div>`;
      }

      async function runEscalationEngine() {
        try {
          const res = await api("POST", "/escalation/run");
          toast(
            `Engine ran: ${res.triggered} escalation(s) triggered`,
            res.triggered > 0 ? "warning" : "success",
          );
          await renderEscalation(document.getElementById("main-content"));
        } catch (e) {
          toast("Engine error: " + e.message, "error");
        }
      }

      async function resolveEscalation(id) {
        try {
          await api("POST", `/escalation/logs/${id}/resolve`);
          toast("Escalation resolved", "success");
          await renderEscalation(document.getElementById("main-content"));
        } catch (e) {
          toast(e.message, "error");
        }
      }

      async function filterEscalation(status) {
        try {
          const logs = await api(
            "GET",
            `/escalation/logs${status ? "?status=" + status : ""}`,
          );
          document.getElementById("escal-log-body").innerHTML =
            renderEscalationLogs(logs, window._escalRules || []);
        } catch (e) {}
      }

      async function deleteEscalationRule(id) {
        if (!confirm("Delete this rule?")) return;
        try {
          await api("DELETE", `/escalation/rules/${id}`);
          toast("Rule deleted", "success");
          await renderEscalation(document.getElementById("main-content"));
        } catch (e) {
          toast(e.message, "error");
        }
      }

      function openAddEscalationRule() {
        showEscalationRuleModal();
      }

      function editEscalationRule(id, name, ruleType, days, isActive) {
        showEscalationRuleModal({
          id,
          name,
          rule_type: ruleType,
          trigger_days: days,
          is_active: isActive,
        });
      }

      function showEscalationRuleModal(rule = null) {
        document.getElementById("edit-goal-title").textContent = rule
          ? "Edit Escalation Rule"
          : "Add Escalation Rule";
        document.getElementById("edit-goal-body").innerHTML = `
          <div class="form-group"><label>Rule Name *</label><input type="text" id="er-name" value="${rule?.name || ""}" placeholder="e.g. Goal Not Submitted (7 days)"></div>
          <div class="form-group"><label>Rule Type *</label>
            <select id="er-type">
              <option value="goal_not_submitted" ${rule?.rule_type === "goal_not_submitted" ? "selected" : ""}>Goal Not Submitted</option>
              <option value="goal_not_approved" ${rule?.rule_type === "goal_not_approved" ? "selected" : ""}>Goal Not Approved</option>
              <option value="checkin_not_done" ${rule?.rule_type === "checkin_not_done" ? "selected" : ""}>Check-in Not Done</option>
            </select>
          </div>
          <div class="form-group"><label>Trigger After (days) *</label><input type="number" id="er-days" value="${rule?.trigger_days || 7}" min="1" max="90"></div>
          <div class="form-group" style="display:flex;align-items:center;gap:10px">
            <input type="checkbox" id="er-active" ${rule?.is_active !== false ? "checked" : ""} style="width:auto">
            <label style="margin:0">Active</label>
          </div>
          <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px">
            <button class="btn btn-ghost" onclick="closeModal('edit-goal-modal')">Cancel</button>
            <button class="btn btn-primary" onclick="saveEscalationRule(${rule?.id || "null"})">Save Rule</button>
          </div>`;
        document.getElementById("edit-goal-modal").classList.remove("hidden");
      }

      async function saveEscalationRule(id) {
        const data = {
          name: document.getElementById("er-name").value.trim(),
          rule_type: document.getElementById("er-type").value,
          trigger_days: parseInt(document.getElementById("er-days").value),
          is_active: document.getElementById("er-active").checked,
        };
        if (!data.name) {
          toast("Rule name required", "error");
          return;
        }
        try {
          if (id) {
            await api("PUT", `/escalation/rules/${id}`, data);
            toast("Rule updated", "success");
          } else {
            await api("POST", "/escalation/rules", data);
            toast("Rule created", "success");
          }
          closeModal("edit-goal-modal");
          await renderEscalation(document.getElementById("main-content"));
        } catch (e) {
          toast(e.message, "error");
        }
      }

      // ── INTEGRATIONS PAGE ─────────────────────────────────────────────────────
      async function renderIntegrations(el) {
        const [stats, logs] = await Promise.all([
          api("GET", "/integrations/stats"),
          api("GET", "/integrations/email-logs?limit=20"),
        ]);

        const settings = stats.settings || {};

        el.innerHTML = `
          <div class="page-header"><h2>📡 Email & Teams Integration</h2><p>Configure notifications and view delivery logs</p></div>

          <!-- Stats Cards -->
          <div class="stats-grid" style="margin-bottom:20px">
            <div class="stat-card"><div class="stat-value">${stats.total_notifications}</div><div class="stat-label">Total Sent</div></div>
            <div class="stat-card"><div class="stat-value" style="color:var(--info)">${stats.by_channel?.email || 0}</div><div class="stat-label">📧 Email</div></div>
            <div class="stat-card"><div class="stat-value" style="color:var(--accent2)">${stats.by_channel?.teams || 0}</div><div class="stat-label">💬 Teams</div></div>
            <div class="stat-card"><div class="stat-value" style="color:var(--success)">${Object.keys(stats.by_event_type || {}).length}</div><div class="stat-label">Event Types</div></div>
          </div>

          <div class="grid-2" style="margin-bottom:20px">
            <!-- Email Config -->
            <div class="card">
              <div class="card-header"><div class="card-title">📧 Email Configuration (SMTP)</div></div>
              <div class="form-group"><label>SMTP Host</label><input type="text" id="cfg-smtp-host" value="${settings.smtp_host || ""}" placeholder="smtp.company.com"></div>
              <div class="form-group"><label>SMTP Port</label><input type="number" id="cfg-smtp-port" value="${settings.smtp_port || 587}" placeholder="587"></div>
              <div style="margin-bottom:12px">
                <div style="font-size:12px;color:var(--text2);font-weight:600;margin-bottom:8px">Notify On:</div>
                ${[
                  ["notify_on_submission", "Goal Submission"],
                  ["notify_on_approval", "Goal Approval"],
                  ["notify_on_rejection", "Goal Rejection"],
                  ["notify_on_checkin", "Check-in Update"],
                ]
                  .map(
                    ([key, label]) => `
                  <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
                    <input type="checkbox" id="cfg-${key}" ${settings[key] ? "checked" : ""} style="width:auto">
                    <label style="margin:0;font-size:13px">${label}</label>
                  </div>`,
                  )
                  .join("")}
              </div>
              <div style="display:flex;gap:10px">
                <button class="btn btn-primary btn-sm" onclick="saveIntegrationSettings()">Save Settings</button>
                <button class="btn btn-ghost btn-sm" onclick="testEmailNotif()">Send Test Email</button>
              </div>
            </div>

            <!-- Teams Config -->
            <div class="card">
              <div class="card-header"><div class="card-title">💬 Microsoft Teams Bot</div></div>
              <div class="form-group"><label>Incoming Webhook URL</label>
                <input type="text" id="cfg-teams-webhook" value="${settings.teams_webhook_url || ""}" placeholder="https://company.webhook.office.com/...">
              </div>
              <div style="padding:14px;background:var(--surface2);border-radius:var(--radius-sm);border:1px solid var(--border);margin-bottom:16px">
                <div style="font-weight:600;font-size:13px;margin-bottom:8px">🔗 Deep Link Support</div>
                <div style="font-size:12px;color:var(--text2)">Teams notifications include deep links that navigate users directly to the relevant goal sheet in the portal. Adaptive cards show goal title, status, and a <em>View Goal</em> action button.</div>
              </div>
              <div style="padding:14px;background:var(--surface2);border-radius:var(--radius-sm);border:1px solid var(--border);margin-bottom:16px">
                <div style="font-weight:600;font-size:13px;margin-bottom:8px">📨 Adaptive Card Preview</div>
                <div style="background:var(--surface);border-radius:8px;border:1px solid var(--border);padding:12px;font-size:12px">
                  <div style="color:var(--accent);font-weight:700;margin-bottom:4px">⬡ AtomQuest Goal Portal</div>
                  <div style="font-weight:600;margin-bottom:4px">Arjun Reddy submitted a goal</div>
                  <div style="color:var(--text2);margin-bottom:8px">Goal: "Increase Q1 Sales Revenue" · Status: Submitted</div>
                  <span style="background:var(--accent);color:white;padding:4px 12px;border-radius:6px;font-size:11px">View Goal →</span>
                </div>
              </div>
              <div style="display:flex;gap:10px">
                <button class="btn btn-primary btn-sm" onclick="saveIntegrationSettings()">Save Webhook</button>
                <button class="btn btn-ghost btn-sm" onclick="testTeamsNotif()">Test Teams Card</button>
              </div>
            </div>
          </div>

          <!-- Event breakdown -->
          <div class="card" style="margin-bottom:20px">
            <div class="card-header"><div class="card-title">📊 Notifications by Event Type</div></div>
            <div style="display:flex;flex-wrap:wrap;gap:10px;padding:4px 0">
              ${Object.entries(stats.by_event_type || {})
                .map(([et, cnt]) => {
                  const icons = {
                    goal_submitted: "📝",
                    goal_approved: "✅",
                    goal_returned: "↩️",
                    checkin_updated: "📅",
                    test: "🧪",
                    teams_test: "💬",
                  };
                  return `<div style="padding:10px 16px;background:var(--surface2);border-radius:var(--radius-sm);border:1px solid var(--border);text-align:center">
                  <div style="font-size:20px">${icons[et] || "🔔"}</div>
                  <div style="font-size:13px;font-weight:600">${cnt}</div>
                  <div style="font-size:11px;color:var(--text2)">${et.replace(/_/g, " ")}</div>
                </div>`;
                })
                .join("")}
              ${!Object.keys(stats.by_event_type || {}).length ? '<div style="color:var(--text2);font-size:13px">No notifications sent yet. Try sending a test.</div>' : ""}
            </div>
          </div>

          <!-- Notification Logs -->
          <div class="card">
            <div class="card-header"><div class="card-title">📬 Recent Notification Log</div></div>
            ${
              !logs.length
                ? '<div class="empty-state" style="padding:20px"><p>No notifications logged yet</p></div>'
                : `<div class="table-wrap"><table>
                <thead><tr><th>Channel</th><th>Recipient</th><th>Subject</th><th>Event</th><th>Status</th><th>Time</th></tr></thead>
                <tbody>
                  ${logs
                    .map(
                      (l) => `<tr>
                    <td>${l.channel === "email" ? "📧 Email" : "💬 Teams"}</td>
                    <td style="color:var(--text2);font-size:12px">#${l.recipient_id}</td>
                    <td style="font-size:12px">${l.subject}</td>
                    <td style="font-size:11px;color:var(--accent2)">${l.event_type || "—"}</td>
                    <td><span style="font-size:11px;padding:2px 8px;border-radius:8px;background:var(--success)22;color:var(--success)">${l.status}</span></td>
                    <td style="font-size:11px;color:var(--text2)">${timeAgo(l.sent_at)}</td>
                  </tr>`,
                    )
                    .join("")}
                </tbody>
              </table></div>`
            }
          </div>`;
      }

      async function saveIntegrationSettings() {
        const data = {
          smtp_host: document.getElementById("cfg-smtp-host").value,
          smtp_port:
            parseInt(document.getElementById("cfg-smtp-port").value) || 587,
          teams_webhook_url: document.getElementById("cfg-teams-webhook").value,
          notify_on_submission: document.getElementById(
            "cfg-notify_on_submission",
          ).checked,
          notify_on_approval: document.getElementById("cfg-notify_on_approval")
            .checked,
          notify_on_rejection: document.getElementById(
            "cfg-notify_on_rejection",
          ).checked,
          notify_on_checkin: document.getElementById("cfg-notify_on_checkin")
            .checked,
        };
        try {
          await api("PUT", "/integrations/email-settings", data);
          toast("Integration settings saved!", "success");
        } catch (e) {
          toast(e.message, "error");
        }
      }

      async function testEmailNotif() {
        try {
          await api("POST", "/integrations/test-email");
          toast("Test email logged & sent!", "success");
          await renderIntegrations(document.getElementById("main-content"));
        } catch (e) {
          toast(e.message, "error");
        }
      }

      async function testTeamsNotif() {
        try {
          await api("POST", "/integrations/test-teams");
          toast("Teams test card dispatched!", "success");
          await renderIntegrations(document.getElementById("main-content"));
        } catch (e) {
          toast(e.message, "error");
        }
      }

      // ── Theme Toggle ──────────────────────────────────────────────────────────
      function toggleTheme() {
        const isLight = document.documentElement.classList.toggle("light");
        document.getElementById("theme-icon").textContent = isLight
          ? "☀️"
          : "🌙";
        localStorage.setItem("aq_theme", isLight ? "light" : "dark");
      }

      // Apply saved theme on load
      (function () {
        const saved = localStorage.getItem("aq_theme");
        if (saved === "light") {
          document.documentElement.classList.add("light");
          document.addEventListener("DOMContentLoaded", () => {
            const icon = document.getElementById("theme-icon");
            if (icon) icon.textContent = "☀️";
          });
        }
      })();

      // ── Boot ──────────────────────────────────────────────────────────────────
      async function boot() {
        if (token && currentUser) {
          // Verify token is still valid before restoring session
          try {
            const me = await api("GET", "/users/me");
            if (me) {
              currentUser = me;
              localStorage.setItem("aq_user", JSON.stringify(currentUser));
              showApp();
              return;
            }
          } catch (e) {
            // Token invalid or expired — clear and show login
            token = null;
            currentUser = null;
            localStorage.removeItem("aq_token");
            localStorage.removeItem("aq_user");
          }
        }
        document.getElementById("login-screen").style.display = "flex";
      }
      boot();
    </script>
  </body>
</html>
